# Sender identity used on the invoice mail
sender:
  name: Atelier Miereveld
  email: ateliermiereveld@proton.me

invoice:
  id_prefix: AM
  # Monthly contribution amount shown on the invoice
  amount: "€ 25,00"
  # Leave empty to derive from system time (invoices are issued for next month)
  year:
  month:

templates_dir: templates

# Proton Drive locations (fetched/uploaded with the official proton-drive CLI).
# Member data never enters this repository.
drive:
  members_path: /Leden/leden.csv
  archive_root: /Facturen

recipients:
  # Values in the "Actief" column that mark a member as active
  active_values: [Ja, ja, Actief lid]

mail:
  subject: "Contributie {year}-{month}"
  body: |
    Beste {name},

    Hierbij ontvang je (aangehecht) de factuur voor maand {month} van {year}.
    Gelieve deze z.s.m., doch uiterlijk binnen 14 dagen te voldoen.

    Alvast dank!
    Veel creatief plezier gewenst!

    Het bestuur van Atelier Miereveld

    (Dit bericht is automatisch aangemaakt en verzonden)

# SMTP settings come from the environment (secrets in CI, never committed):
#   SMTP_HOST, SMTP_PORT, SMTP_TLS (1 = STARTTLS), SMTP_USER, SMTP_PASSWORD
# Defaults target a local Proton Mail Bridge on 127.0.0.1:1025.
