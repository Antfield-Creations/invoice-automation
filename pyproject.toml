[build-system]
requires = ["uv_build>=0.13"]
build-backend = "uv_build"

[project]
name = "invoice-automation"
version = "0.1.0"
description = "Automate the boring stuff: monthly recurring invoices for Atelier Miereveld"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "google-api-python-client",
    "google-auth-httplib2",
    "google-auth-oauthlib",
    "pyyaml",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
