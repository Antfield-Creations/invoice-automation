[build-system]
# uv's native build backend: builds and installs the src/invoice_automation package itself
requires = ["uv_build>=0.13"]
build-backend = "uv_build"

[project]
name = "invoice-automation"
version = "0.1.0"
description = "Automate the boring stuff: monthly recurring invoices for Atelier Miereveld"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jinja2",      # renders templates/invoice.html with recipient/invoice data (src/invoice_automation/render.py)
    "pyyaml",      # loads config.yaml (src/invoice_automation/config.py)
    "weasyprint",  # HTML -> PDF invoice rendering (src/invoice_automation/render.py); needs system pango libs, see `make install-system`
]

[dependency-groups]
dev = [
    "pytest",      # test runner for tests/ (`make test`)
    "pytest-cov",  # coverage measurement (`make coverage`)
    "ruff",        # linter/formatter checks (`make lint`)
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
# entry-point shim; exercised via subprocess in tests/test_main.py
omit = ["src/main.py"]

[tool.ruff]
src = ["src"]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
