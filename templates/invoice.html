<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <title>Factuur {{ invoice_id }}</title>
  <style>
    body { font-family: sans-serif; font-size: 11pt; color: #222; margin: 2cm; }
    .sender { margin-bottom: 2cm; }
    .sender .name { font-weight: bold; font-size: 14pt; }
    .address { margin-bottom: 1.5cm; }
    h1 { font-size: 16pt; margin-bottom: 0.2cm; }
    .meta { color: #555; margin-bottom: 1.5cm; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border-bottom: 1px solid #ccc; padding: 6pt 4pt; text-align: left; }
    .total td { border-bottom: none; font-weight: bold; }
  </style>
</head>
<body>
  <div class="sender">
    <div class="name">Atelier Miereveld</div>
    ateliermiereveld@proton.me
  </div>

  <div class="address">
    {{ recipient_name }}<br>
    {{ address }}<br>
    {{ postcode }} {{ city }}
  </div>

  <h1>Factuur</h1>
  <div class="meta">
    Factuurnummer: {{ invoice_id }}<br>
    Datum: {{ date }}
  </div>

  <table>
    <tr><th>Omschrijving</th><th>Bedrag</th></tr>
    <tr>
      <td>Maandelijkse contributie {{ month }}/{{ year }}</td>
      <td>{{ amount }}</td>
    </tr>
    <tr class="total">
      <td>Totaal</td>
      <td>{{ amount }}</td>
    </tr>
  </table>
</body>
</html>
